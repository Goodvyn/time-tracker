/* ---------- updates ----------
   The file on your computer starts whatever is the newest version this browser has (see the starter at the end of
   the file). Here: every so often, look for a newer version at UPDATE_URL, keep it in this browser, and offer a reload.
   The file itself never changes, so your data and the backup setup stay exactly as they are. */
const upd = { ready:'', checking:false, last:0, error:'' };
const verCmp = (a, b) => { const x = String(a).split('.'), y = String(b).split('.');
  for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (+x[i] || 0) - (+y[i] || 0); if (d) return d; } return 0; };
const updRead = () => { try { return JSON.parse(localStorage.getItem(UPD_KEY) || '{}') || {}; } catch { return {}; } };
const canUpdate = () => !!window.__ttBoot && /^https:\/\/raw\.githubusercontent\.com\/(?!OWNER\/)/.test(UPDATE_URL);
async function checkUpdate(manual){
  if (!canUpdate() || upd.checking) return;
  upd.checking = true; if (manual && ui.view === 'data') render();
  try {
    const r = await fetch(UPDATE_URL + '?t=' + Date.now(), { cache:'no-store' });
    if (!r.ok) throw new Error(r.status === 404 ? 'not found' : 'HTTP ' + r.status);
    const html = await r.text();
    const v = (html.match(/const APP_VERSION = '([\d.]+)'/) || [])[1];
    if (!v || !html.includes('id="tt-app"')) throw new Error('not a tracker file');
    const c = updRead();
    upd.last = Date.now(); upd.error = '';
    if (verCmp(v, APP_VERSION) > 0 && v !== c.bad) {
      if (c.v !== v || !c.html) localStorage.setItem(UPD_KEY, JSON.stringify({ v, html, at:Date.now(), bad:c.bad || '' }));
      const was = upd.ready; upd.ready = v;
      if (manual || was !== v) renderBanner();
    } else upd.ready = '';
    if (manual) toast(upd.ready ? `Version ${upd.ready} is ready. Reload to start using it.` : `You have the latest version (${APP_VERSION}).`);
  } catch (err) {
    upd.error = String(err && err.message || err);
    if (manual) toast(`Couldn't check for updates (${esc(upd.error)}).`, { error:true });
  } finally { upd.checking = false; if (ui.view === 'data') render(); }
}
function initUpdates(){
  if (!canUpdate()) return;
  const c = updRead();
  if (c.html && c.v !== c.bad && verCmp(c.v, APP_VERSION) > 0) upd.ready = c.v;   // already downloaded, not started yet
  setTimeout(() => checkUpdate(), 5000);
  setInterval(() => checkUpdate(), 30 * 60000);
  window.addEventListener('focus', () => { if (Date.now() - upd.last > 10 * 60000) checkUpdate(); });
}
function applyUpdate(){ window.__ttReloading = true; location.reload(); }   // the timer and everything else are saved, so a reload is safe

}

function logDayKeys(p){

/* Opening / closing animations: content slides open after it's rendered, and slides shut before it's removed */
const FOLD_MS = 170;
let folding = false;
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
/* Show (text), re-word, or hide (null) a small note. With animate, it slides open or shut and whatever it sits in grows
   or shrinks with it. o: the note's margin-top and padding when open, and the margin-top when shut (to cancel a gap). */
function slideNote(el, text, animate, o){
  const st = el._slide || (el._slide = { on:!el.hidden, anim:null }), on = text != null;
  if (on === st.on && (!on || text === el.textContent)) return;
  const h0 = el.hidden ? 0 : el.getBoundingClientRect().height;   // mid-animation too
  if (st.anim) { st.anim.cancel(); st.anim = null; }
  st.on = on; if (on) el.textContent = text; el.hidden = false;
  if (!animate || reduceMotion()) { el.hidden = !on; return; }
  const full = el.getBoundingClientRect().height;
  const shut = { height:'0px', marginTop:o.shut || '0px', paddingTop:'0px', paddingBottom:'0px', opacity:0, overflow:'hidden' };
  const open = h => ({ height:h + 'px', marginTop:o.mt, paddingTop:o.py, paddingBottom:o.py, opacity:1, overflow:'hidden' });
  if (on && h0 && Math.abs(h0 - full) < .5) return;
  st.anim = el.animate(!on ? [open(h0), shut] : h0 ? [open(h0), open(full)] : [shut, open(full)], { duration:200, easing:'cubic-bezier(.2,.8,.3,1)' });
  st.anim.onfinish = () => { st.anim = null; if (!st.on) el.hidden = true; };
}

  if (reduceMotion()) return;
  for (const el of els.filter(Boolean)) {
    const h = el.getBoundingClientRect().height; if (!h) continue;

    el.animate([{ height:'0px', opacity:0 }, { height:h + 'px', opacity:1 }], { duration:FOLD_MS, easing:'cubic-bezier(.2,.8,.3,1)' })
      .onfinish = () => { el.style.overflow = ''; };
  }
}
function shrinkOut(els, done){
  els = els.filter(Boolean);
  if (!els.length || reduceMotion()) { done(); return; }
  folding = true;
  let left = els.length;
  const fin = () => { if (--left === 0) { folding = false; done(); } };
  for (const el of els) {
    const h = el.getBoundingClientRect().height;
    el.style.overflow = 'hidden';
    el.animate([{ height:h + 'px', opacity:1 }, { height:'0px', opacity:0 }], { duration:FOLD_MS - 30, easing:'cubic-bezier(.4,0,.7,1)', fill:'forwards' }).onfinish = fin;

const RANGES = [['today','Today'],['yesterday','Yesterday'],['week','This week'],['lastweek','Last week'],['month','This month'],['lastmonth','Last month'],['all','All time'],['custom','Custom']];
const RANGE_SHORT = { yesterday:'Yest.', week:'This wk', lastweek:'Last wk', month:'This mo', lastmonth:'Last mo', all:'All' };
function getRange(key){
  const now = Date.now(), sod = startOfDay(now), sow = startOfWeek(now), som = startOfMonth(now);
  switch (key) {
    case 'today':     return [sod, addDays(sod,1)];
    case 'yesterday': return [addDays(sod,-1), sod];
    case 'week':      return [sow, addDays(sow,7)];
    case 'lastweek':  return [addDays(sow,-7), sow];
    case 'month':     return [som, addMonths(som,1)];
    case 'lastmonth': return [addMonths(som,-1), som];
    case 'custom': {
      let f = ui.customFrom ? localMs(ui.customFrom) : sow;
      let t = ui.customTo ? addDays(localMs(ui.customTo), 1) : addDays(sow, 7);
      if (!isFinite(f)) f = sow;
      if (!isFinite(t) || t <= f) t = addDays(f, 1);
      return [f, t];
    }
    default: return [0, FAR];
  }
}
function rangeLabel(from, to){
  if (to >= FAR) return 'All time';
  const last = addDays(to, -1);
  const o = {month:'short', day:'numeric', year:'numeric'};
  if (last === from) return fmtDate(from, {weekday:'long', month:'long', day:'numeric', year:'numeric'});
  return `${fmtDate(from, o)} – ${fmtDate(last, o)}`;
}
function summarize(from, to){
  const now = Date.now(), byP = new Map(); let total = 0;
  for (const e of S.entries) {
    const d = entryDur(e, from, to, now);
    if (!d) continue;
    total += d;
    let x = byP.get(e.projectId);
    if (!x) { x = { total:0, tasks:new Map() }; byP.set(e.projectId, x); }
    x.total += d;
    const k = e.taskId || '';
    x.tasks.set(k, (x.tasks.get(k) || 0) + d);
  }
  return { total, byP };
}

      ps.push({ from:d, to:addDays(d,1), label:l, tip:l, cls:(d > sod ? ' future' : '') + (d === sod ? ' today' : '') }); }
    chart = stackCard('By day', ps);
  } else if (rows.length) {
    const first = to >= FAR ? Math.min(...S.entries.map(e => e.start)) : from, last = to >= FAR ? now : to;
    const ps = []; for (let m = startOfMonth(first); m < last; m = addMonths(m,1))
      ps.push({ from:Math.max(m, from), to:Math.min(addMonths(m,1), to), label:fmtDate(m, {month:'short', year:'numeric'}), tip:fmtDate(m, {month:'long', year:'numeric'}),
                cls:(m > som ? ' future' : '') + (m === som ? ' today' : '') });

/* Total: one click switches 29h 28m ⇄ 29.47 h. Dragging across it selects text as usual (no switch);
   a double-click selects the whole value so it can be copied. */
let totTimer = 0, totClickAt = 0, totFiredFor = -1;
function setTotalDec(on){
  ui.totalDec = on;
  const v = $('#main .tb-val'); if (!v) return;
  v.classList.toggle('dec', on); v.title = on ? 'Click to show hours and minutes' : 'Click to show decimal hours';

document.addEventListener('click', e => {
  const v = e.target.closest && e.target.closest('.tb-val'); if (!v) return;
  const sel = window.getSelection();
  if (e.detail >= 2) {
    clearTimeout(totTimer); totTimer = 0;
    if (totFiredFor === totClickAt) { totFiredFor = -1; setTotalDec(!ui.totalDec); }   // a slow double-click: undo the switch its own first click made
    const shown = v.querySelector(v.classList.contains('dec') ? '.fmt-dec' : '.fmt-hm');
    const r = document.createRange(); r.selectNodeContents(shown); sel.removeAllRanges(); sel.addRange(r);
    return;
  }
  if (sel && !sel.isCollapsed && v.contains(sel.anchorNode)) return;      // just finished selecting text: leave it
  clearTimeout(totTimer);
  const at = totClickAt = e.timeStamp;
  totTimer = setTimeout(() => { totTimer = 0; totFiredFor = at; setTotalDec(!ui.totalDec); }, 220);
});

/* Timeline for a single day: one lane per project, blocks where you worked on it (touching blocks get a notch) */
function timelineCard(d0, d1, rows, pOrder){
  const now = Date.now(), H = 3600e3;
  const es = S.entries.map(e => ({ e, s:Math.max(e.start, d0), en:Math.min(e.end ?? now, d1) }))
    .filter(x => x.en > x.s && pOrder.has(x.e.projectId)).sort((a,b) => a.s - b.s);
  const dayLabel = fmtDate(d0, {weekday:'long', month:'short', day:'numeric'});
  const head = `<div class="card-head"><h2>Timeline</h2><span class="muted">${es.length ? 'Hover a block to see the project and task' : ''}</span></div>`;
  if (!es.length) return `<section class="card sum-days sum-tl">${head}<div class="empty sm"><p>No time tracked on this day.</p></div></section>`;
  const nowIn = now >= d0 && now < d1;
  const floorH = t => { const x = new Date(t); x.setMinutes(0,0,0); return x.getTime(); };
  const ceilH = t => { const x = new Date(t); if (x.getMinutes() || x.getSeconds() || x.getMilliseconds()) x.setMinutes(60,0,0); return x.getTime(); };
  let t0 = Math.max(d0, floorH(Math.min(...es.map(x => x.s))));
  let t1 = Math.min(d1, ceilH(Math.max(nowIn ? now : 0, ...es.map(x => x.en))));
  while (t1 - t0 < 4*H) { if (t1 < d1) t1 = Math.min(d1, t1 + H); else if (t0 > d0) t0 = Math.max(d0, t0 - H); else break; }
  const step = t1 - t0 > 12*H ? 2 : 1, ticks = [];
  for (const x = new Date(t0); x.getTime() <= t1; x.setHours(x.getHours() + step)) ticks.push(x.getTime());
  const pct = t => ((t - t0) / (t1 - t0) * 100).toFixed(3) + '%';
  const grid = ticks.map(t => `<b class="tl-tick" style="left:${pct(t)}"></b>`).join('');
  const lanes = rows.filter(x => es.some(y => y.e.projectId === x.p.id)).map(x => {
    const mine = es.filter(y => y.e.projectId === x.p.id);
    return `<div class="tlane" data-label="${esc(dayLabel)}">
      <span class="sname"><span class="dot" style="background:${x.p.color}"></span><span class="n">${esc(x.p.name)}</span></span>
      <span class="ttrack">${grid}${mine.map((y, i) => `<i class="tblk${i && y.s - mine[i-1].en < 60000 ? ' notch' : ''}" data-pid="${x.p.id}" data-tid="${y.e.taskId || ''}" data-s="${y.s}" data-e="${y.en}"${y.e.end == null ? ' data-run="1"' : ''} style="left:${pct(y.s)};width:${((y.en - y.s) / (t1 - t0) * 100).toFixed(3)}%;--c:${x.p.color}"></i>`).join('')}${nowIn ? `<b class="tnow" style="left:${pct(now)}" title="Now"></b>` : ''}</span>
      ${live({pid:x.p.id, from:d0, to:d1, f:'hmz', cls:'r'})}
    </div>`;
  }).join('');
  const hourLabel = t => new Date(t).toLocaleTimeString([], {hour:'numeric'});
  return `<section class="card sum-days sum-tl">${head}
    <div class="tl-axis"><span></span><span class="tticks">${ticks.map(t => `<span style="left:${pct(t)}">${hourLabel(t)}</span>`).join('')}</span><span></span></div>
    <div class="chart tlines">${lanes}</div></section>`;
}

/* Chart tooltip: follows the mouse along a bar / timeline lane and names the project and task under it */
let tipSeg = null;
function tipEl(){ let t = $('#tip'); if (!t) { t = document.createElement('div'); t.id = 'tip'; t.setAttribute('role', 'tooltip'); document.body.appendChild(t); } return t; }

// light up the project (and, if it's open, the task) in the Total list, and bring it into view
function litList(pid, tid){
  $$('.sum-total .srow.lit').forEach(r => r.classList.remove('lit'));
  if (!pid) return;
  const pr = $(`.sum-total .srow.proj[data-pid="${CSS.escape(pid)}"]`); if (!pr) return;
  const tr = $(`.sum-total .srow.sub[data-pid="${CSS.escape(pid)}"][data-tid="${CSS.escape(tid || '')}"]`);
  pr.classList.add('lit'); if (tr) tr.classList.add('lit');
  const list = pr.closest('.slist'), target = tr || pr;
  if (list) { const lr = list.getBoundingClientRect(), r = target.getBoundingClientRect(), top = Math.min(pr.getBoundingClientRect().top, r.top);
    if (top < lr.top) list.scrollTop -= lr.top - top + 6; else if (r.bottom > lr.bottom) list.scrollTop += r.bottom - lr.bottom + 6; }
}
function segAt(row, x){
  const lane = row.classList.contains('tlane');
  const box = row.querySelector(lane ? '.ttrack' : '.stk'); if (!box) return null;
  const r = box.getBoundingClientRect(); if (!r.width || x < r.left - 3 || x > r.right + 3) return null;
  let best = null, bd = Infinity;
  for (const sg of box.querySelectorAll('.tseg, .tblk')) { const b = sg.getBoundingClientRect(), d = x < b.left ? b.left - x : x > b.right ? x - b.right : 0;
    if (d < bd) { bd = d; best = sg; } }
  if (lane && bd > 3) return null;                  // timeline: empty time between blocks shows nothing
  if (!lane && best) { const st = box.getBoundingClientRect(); if (x > st.right + 3) return null; }
  return best;
}
function showTip(sg, row, x){

}

const dlg = $('#dlg');
let dlgSeq = 0, dlgCancel = null;
function openDialog(html, onSubmit, onOpen, onCancel){
  const seq = ++dlgSeq;
  dlgCancel = onCancel || null;
  dlg.innerHTML = html;
  const form = dlg.querySelector('form');
  // Enter in a field submits with the dialog's main button. (By default the browser uses the FIRST submit button,
  // which in "Edit total" was "Delete all time".) Enter on a focused button still presses that button.
  form.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter' || ev.isComposing || ev.shiftKey || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    const t = ev.target;
    if (!t.matches('input:not([type=checkbox]):not([type=radio]):not([type=button]):not([type=submit]), select')) return;
    const main = form.querySelector('button[type=submit][data-main]') || form.querySelector('button[type=submit].primary')
      || [...form.querySelectorAll('button[type=submit]')].find(b => !b.classList.contains('danger-outline'));
    if (!main || main.disabled) return;
    ev.preventDefault();
    form.requestSubmit(main);
  });
  form.addEventListener('submit', ev => {
    ev.preventDefault();
    const res = onSubmit ? onSubmit(new FormData(form), form, ev.submitter) : undefined;
    if (res !== false && seq === dlgSeq) { dlgCancel = null; dlg.close(); }
  });
  if (onOpen) onOpen(form);
  if (!dlg.open) dlg.showModal();
  const f = form.querySelector('[autofocus]') || form.querySelector('input:not([type=radio]):not([type=checkbox]):not([disabled]), select, textarea');
  if (f) { f.focus(); if (f.select && f.type === 'text' && f.value) f.select(); }
}
function cancelDialog(){ const c = dlgCancel; dlgCancel = null; if (dlg.open) dlg.close(); if (c) c(); }
dlg.addEventListener('cancel', e => { e.preventDefault(); cancelDialog(); });
dlg.addEventListener('mousedown', e => { if (e.target === dlg) cancelDialog(); });
const actionsHtml = (ok, kind='primary') => `<div class="dlg-actions"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn ${kind}" type="submit">${ok}</button></div>`;

function confirmDialog({title, message, ok='Delete', danger=true}){
  return new Promise(res => {
    openDialog(`<form><h2>${esc(title)}</h2><p class="dlg-msg">${message}</p>${actionsHtml(esc(ok), danger ? 'danger' : 'primary')}</form>`,
      () => res(true), null, () => res(false));
    const b = dlg.querySelector('button[type=submit]'); if (b) b.focus();
  });
}

function dlgEntry(e, def={}){
  const isNew = !e;
  const isRunning = !!(e && e.end == null);
  const pid0 = e ? e.projectId : (def.projectId || ui.projectId || (S.projects[0] && S.projects[0].id));
  if (!pid0) { toast('Create a project first'); return; }
  const now = Date.now();
  const roundedNow = Math.floor(now / 300000) * 300000;
  const start0 = e ? e.start : roundedNow - 3600000;
  const end0 = e ? (e.end ?? now) : roundedNow;
  const projOpts = S.projects.filter(p => !p.archived || p.id === pid0)
    .map(p => `<option value="${p.id}" ${p.id === pid0 ? 'selected' : ''}>${esc(p.name)}</option>`).join('');

  openDialog(`<form><h2>${isNew ? 'Add time' : 'Edit time entry'}</h2>
    <div class="field-row two">
      <div class="field"><label for="f-pid">Project</label><select class="input" id="f-pid" name="pid">${projOpts}</select></div>
      <div class="field"><label for="f-tid">Task</label><select class="input" id="f-tid" name="tid"></select></div>
    </div>
    <div class="field-row dt">
      <div class="field date"><label for="f-date">Date</label><input class="input" type="date" id="f-date" name="date" required value="${toDateInput(start0)}"></div>
      <div class="field"><label for="f-start">Start</label><input class="input" type="time" id="f-start" name="start" required value="${toTimeInput(start0)}"></div>
      <div class="field"><label for="f-end">End</label><input class="input" type="time" id="f-end" name="end" ${isRunning ? 'disabled' : 'required'} value="${isRunning ? '' : toTimeInput(end0)}"></div>
    </div>
    <div class="field"><label for="f-dur">Duration</label><input class="input" id="f-dur" name="dur" ${isRunning ? 'disabled value="Still running"' : `value="${fmtDurInput(end0 - start0)}"`} placeholder="e.g. 1:30, 1h 30m or 1.5" autocomplete="off">
      <div class="hint" id="f-hint">${isRunning ? 'This timer is still running. You can change when it started.' : 'Type a duration to set the end time automatically.'}</div>
      <div class="field-warn" id="f-warn" hidden></div></div>
    <div class="field"><label for="f-note">Note (optional)</label><input class="input" id="f-note" name="note" maxlength="300" value="${e ? esc(e.note) : ''}"></div>
    ${actionsHtml(isNew ? 'Add time' : 'Save')}</form>`,
    (fd, form) => {
      const pid = String(fd.get('pid'));
      const p = proj(pid); if (!p) return false;
      const tid = String(fd.get('tid') || '') || null;
      const dateStr = String(fd.get('date')), startStr = String(fd.get('start'));
      let start = localMs(dateStr, startStr);
      if (e && dateStr === toDateInput(e.start) && startStr === toTimeInput(e.start)) start = e.start; // keep seconds
      if (!isFinite(start)) { hint('Please enter a valid date and start time.', true); return false; }
      let end = null;
      if (!isRunning) {
        const endStr = String(fd.get('end'));
        end = localMs(dateStr, endStr);
        if (!isFinite(end)) { hint('Please enter a valid end time.', true); return false; }
        if (end <= start) end = addDays(end, 1);
        // Keep exact times when they weren't changed. This also keeps entries correct around daylight-saving
        // changes, where a clock time like 1:30 AM can happen twice and the typed time alone is ambiguous.
        if (e && e.end != null && endStr === toTimeInput(e.end) && dateStr === toDateInput(e.start)) end = e.end;
        if (form._durEnd != null && form._durKey === dateStr + '|' + startStr && endStr === toTimeInput(form._durEnd)) end = form._durEnd;
        if (end - start < 1000) { hint('The end time must be after the start time.', true); return false; }
      } else if (start > Date.now()) { hint('A running timer can’t start in the future.', true); return false; }
      const note = String(fd.get('note') || '').trim();
      if (isNew) S.entries.push({ id:uid(), projectId:pid, taskId:tid, start, end, note });
      else Object.assign(e, { projectId:pid, taskId:tid, start, end, note });
      S.entries.sort((a,b) => a.start - b.start);
      save(); render();
      const later = end != null && end > Date.now() + 60000 ? ` · ends ${whenFrom(end)}` : '';
      toast(isNew ? `Added ${fmtHM(end - start)} to <b>${esc(p.name)}</b>${later}` : `Entry updated${later}`);
    },
    form => {
      const pidSel = form.querySelector('#f-pid'), tidSel = form.querySelector('#f-tid');
      const fillTasks = (sel) => {
        const p = proj(pidSel.value);
        tidSel.innerHTML = `<option value="">No specific task</option>` + (p ? p.tasks.filter(t => !t.done || t.id === sel).map(t => `<option value="${t.id}" ${t.id === sel ? 'selected' : ''}>${esc(t.name)}</option>`).join('') : '');
      };
      fillTasks(e ? e.taskId : (def.taskId || ''));
      pidSel.addEventListener('change', () => fillTasks(''));
      if (isRunning) return;
      const dateI = form.querySelector('#f-date'), startI = form.querySelector('#f-start'), endI = form.querySelector('#f-end'), durI = form.querySelector('#f-dur');
      const calc = (sv = startI.value, ev = endI.value) => {
        const s = localMs(dateI.value, sv); let en = localMs(dateI.value, ev);
        if (!isFinite(s) || !isFinite(en)) return null;
        if (en <= s) en = addDays(en, 1);
        return [s, en];
      };
      const showSpan = () => {
        const c = calc(); if (!c) return;
        hint(startOfDay(c[1]) !== startOfDay(c[0]) ? `Ends the next day (${fmtDate(c[1], {weekday:'short'})} ${fmtTime(c[1])}).` : 'Type a duration to set the end time automatically.');
      };
      const fromTimes = () => { form._durEnd = null; const c = calc(); if (c) durI.value = fmtDurInput(c[1] - c[0]); showSpan(); };
      [dateI, startI, endI].forEach(i => i.addEventListener('input', fromTimes));

function checkForgottenTimer(leftAt, reason){
  const r = running();
  if (!r || !leftAt || leftAt < r.start) return;
  const backAt = Date.now();
  const away = backAt - leftAt;
  if (away < 5 * 60000) return;
  const p = proj(r.projectId), t = taskOf(p, r.taskId);
  const asleep = reason === 'asleep';
  const at = ts => (startOfDay(ts) === startOfDay(backAt) ? '' : fmtDate(ts, {weekday:'short', month:'short', day:'numeric'}) + ', ') + fmtTime(ts);
  const awayTxt = fmtHM(away), beforeTxt = fmtHM(leftAt - r.start);
  const leftTxt = asleep ? 'Computer went to sleep' : 'Tracker was closed';
  const backTxt = asleep ? 'Woke up' : 'Reopened';

  const choices = {
    skip: `<button class="choice" type="submit" value="skip"><b>Don't count the ${awayTxt} away</b>
      <span>Keeps the ${beforeTxt} before ${asleep ? 'it went to sleep' : 'you closed it'}, and the timer keeps running from ${fmtTime(backAt)}.</span></button>`,
    count: `<button class="choice" type="submit" value="count"><b>Count the time away too</b>
      <span>Changes nothing. The timer has been running since ${at(r.start)}.</span></button>`,
    stop: `<button class="choice" type="submit" value="stop"><b>Stop the timer at ${at(leftAt)}</b>
      <span>Logs ${beforeTxt} and stops. Use this if you'd already finished.</span></button>`
  };
  // Most likely choice first: after sleep you're usually still working; after closing you usually forgot to stop.
  const order = asleep ? ['skip', 'count', 'stop'] : ['stop', 'skip', 'count'];

  openDialog(`<form class="away-dlg"><h2>${asleep ? 'Your computer was asleep' : 'The tracker was closed'} while a timer was running</h2>
    <p class="dlg-msg"><span class="dot" style="background:${p.color}"></span> <b>${esc(t ? t.name : 'No specific task')}</b> · ${esc(p.name)}</p>
    <div class="away-tl">
      <span class="k">Timer started</span><span class="v">${at(r.start)}</span><span class="n"></span>
      <span class="k">${leftTxt}</span><span class="v">${at(leftAt)}</span><span class="n">${beforeTxt} tracked</span>
      <span class="k">${backTxt}</span><span class="v">${at(backAt)}</span><span class="n away">${awayTxt} away</span>
    </div>
    <p class="dlg-msg">What should happen to the <b>${awayTxt}</b> you were away?</p>
    <div class="choices">${order.map((k, i) => choices[k].replace('class="choice"', `class="choice${i === 0 ? ' rec' : ''}"`)).join('')}</div>
    <p class="hint">You can undo your choice right after.</p></form>`,
    (fd, form, submitter) => {
      const v = submitter ? submitter.value : 'count';
      if (v === 'count') { toast('Kept all the time. The timer is still running.'); return; }
      withUndo(v === 'skip' ? `Removed ${awayTxt} away. The timer keeps running.` : `Timer stopped at ${esc(fmtTime(leftAt))}. ${beforeTxt} logged.`, () => {
        const e = S.entries.find(x => x.id === r.id);
        if (!e || e.end != null) return;
        e.end = Math.max(e.start + 1000, leftAt);
        if (v === 'skip') S.entries.push({ id:uid(), projectId:e.projectId, taskId:e.taskId, start:backAt, end:null, note:e.note || '' });
      }, 15000);
    });
}

/* =========================================================
   Toast & undo
   ========================================================= */
function toast(msg, opts={}){
  // Also show it in the floating timer when it has an Undo or you're not looking at the tracker tab
  const boxes = [$('#toast')];
  const mbox = mini.win && mini.win.document.getElementById('m-toast');
  if (mbox && (opts.undo || opts.mini || document.hidden)) boxes.push(mbox);
  const els = boxes.map(box => {
    const doc = box.ownerDocument;
    const t = doc.createElement('div');
    t.className = 'toast' + (opts.error ? ' error' : '');
    t.innerHTML = `<span>${msg}</span>`;
    if (opts.undo) {
      const b = doc.createElement('button');
      b.textContent = 'Undo';
      b.onclick = () => { opts.undo(); els.forEach(x => x.remove()); };
      t.appendChild(b);
    }
    // only the latest action can be undone: an older Undo would also roll back everything done since
    if (opts.undo) { t.classList.add('has-undo'); box.querySelectorAll('.toast.has-undo').forEach(x => x.remove()); }
    while (box.children.length > (box === mbox ? 0 : 2)) box.firstChild.remove();
    box.appendChild(t);
    return t;
  });
  // disappears after a while, but not while the pointer is resting on it
  const remove = () => els.forEach(t => t.remove());
  let timer = setTimeout(remove, opts.ms || (opts.undo ? 7000 : 3000));
  els.forEach(t => {
    t.addEventListener('mouseenter', () => clearTimeout(timer));
    t.addEventListener('mouseleave', () => { clearTimeout(timer); timer = setTimeout(remove, 1500); });
  });
}
function withUndo(msg, mutate, ms){

  save(); render();
  toast(msg, { ms, undo:() => { S = normalize(JSON.parse(snap)); save(); render(); toast('Undone'); } });

   ========================================================= */
const backup = { supported:typeof window.showSaveFilePicker === 'function', handle:null, name:'', status:'off', error:'', lastWrite:0, timer:null, peek:null };

function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('timeTracker', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function kv(mode, key, val){
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', mode === 'get' ? 'readonly' : 'readwrite');
    const st = tx.objectStore('kv');
    const q = mode === 'get' ? st.get(key) : mode === 'set' ? st.put(val, key) : st.delete(key);
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
async function peekHandle(h){

    return d.projects.length || d.entries.length ? { projects:d.projects.length, entries:d.entries.length, data:d } : null;
  } catch { return null; }
}
async function initBackup(){

  try {
    const h = await kv('get', 'backupHandle');
    if (h) {
      backup.handle = h; backup.name = h.name;
      const perm = await h.queryPermission({ mode:'readwrite' });
      backup.status = perm === 'granted' ? 'ok' : 'paused';
      if (backup.status === 'ok') {

}

  try { await kv('set', 'backupHandle', h); } catch (e) { console.warn(e); }
  backup.peek = isEmpty() ? await peekHandle(h) : null;
  await writeBackup(true); // just picked: the file may not exist on disk yet

const PICKER_ID = 'time-tracker-backup';
const BACKUP_TYPES = [{ description:'Time Tracker backup', accept:{ 'application/json':['.json'] } }];

}

  let h;

  } catch (e) { if (e.name !== 'AbortError') toast(esc(e.message), {error:true}); return; }

  // ask before overwriting it.

function chooseBackupConflict(name, fileData, exportedAt, extraP, extraE){

  const missing = [extraP ? plural(extraP, 'project') : '', extraE ? plural(extraE, 'time entry').replace('entrys', 'entries') : ''].filter(Boolean).join(' and ');
  return new Promise(res => {

      <b>${missing}</b> in it ${extraP + extraE === 1 ? "isn't" : "aren't"} in the tracker right now. Replacing the file would lose ${extraP + extraE === 1 ? 'it' : 'them'}.</p>
      <div class="dlg-actions stack">
        <button class="btn primary" type="submit" value="merge">Combine both (nothing is lost)</button>
        <button class="btn" type="submit" value="restore">Restore from file (replace what's in the tracker)</button>
        <button class="btn danger-outline" type="submit" value="replace">Replace file with tracker data</button>
        <button class="btn ghost" type="button" data-close>Cancel</button>

function mergeData(cur, file){

    if (!p) { out.projects.push(fp); pmap.set(fp.id, fp); continue; }
    const tids = new Set(p.tasks.map(t => t.id));
    for (const t of fp.tasks) if (!tids.has(t.id)) p.tasks.push(t);
  }
  const tkey = t => (t.name + '|' + t.tasks.join('|')).trim().toLowerCase();
  const tids = new Set(out.templates.map(t => t.id)), tkeys = new Set(out.templates.map(tkey));
  for (const t of file.templates) if (!tids.has(t.id) && !tkeys.has(tkey(t))) out.templates.push(t);

        .then(ok => { if (ok) withUndo('Time entry deleted', () => { S.entries = S.entries.filter(x => x.id !== d.id); }); });

<script id="tt-boot">
/* Starts the tracker. The tracker downloads its own updates into this browser; if a newer version than the one in
   this file is saved, that one runs, otherwise the copy in this file does. A saved version that fails to start is
   skipped from then on (the page reloads and runs the copy in this file). This part is kept short on purpose:
   it's the one bit that never updates. */
